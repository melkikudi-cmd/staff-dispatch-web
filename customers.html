<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Customers - Staff Dispatch Web</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body { margin:0; font-family: Arial,sans-serif; background:#0f172a; color:white; }
    header { background:#020617; padding:20px; text-align:center; font-size:24px; font-weight:bold;}
    nav { display:flex; justify-content:center; gap:20px; background:#020617; padding-bottom:10px;}
    nav a { color:#38bdf8; text-decoration:none; font-weight:bold;}
    .container { padding:40px 20px; max-width:1000px; margin:auto; }
    table { width:100%; border-collapse:collapse; }
    th, td { padding:12px; border-bottom:1px solid #1e293b; }
    th { color:#38bdf8; }
  </style>
</head>
<body>

<header>Staff Dispatch Web</header>

<nav>
  <a href="index.html">Home</a>
  <a href="workers.html">Workers</a>
  <a href="customers.html">Customers</a>
  <a href="events.html">Events</a>
</nav>

<div class="container">
  <h1>Customers</h1>
  <table id="customers-table">
    <tr>
      <th>Name</th>
      <th>Type</th>
      <th>Custom Rate (ZAR)</th>
    </tr>
  </table>
</div>

<script type="module" src="supabaseClient.js"></script>

<script type="module">
  const table = document.getElementById('customers-table')

  async function loadCustomers() {
    const { data, error } = await window.supabase
      .from('customers')
      .select('*')

    if (error) {
      console.error(error)
      return
    }

    data.forEach(c => {
      const row = document.createElement('tr')
      row.innerHTML = `
        <td>${c.name}</td>
        <td>${c.customer_type}</td>
        <td>R ${c.custom_rate ?? '-'}</td>
      `
      table.appendChild(row)
    })
  }

  loadCustomers()
</script>

</body>
</html>
