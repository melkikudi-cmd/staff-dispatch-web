<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Staff Dispatch Web</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: white;
    }
    header {
      background: #020617;
      padding: 20px;
      text-align: center;
      font-size: 24px;
      font-weight: bold;
    }
    nav {
      display: flex;
      justify-content: center;
      gap: 20px;
      background: #020617;
      padding-bottom: 10px;
    }
    nav a {
      color: #38bdf8;
      text-decoration: none;
      font-weight: bold;
    }
    .section {
      max-width: 1200px;
      margin: 40px auto;
      padding: 0 20px;
    }
    h2 {
      color: #38bdf8;
      text-align: center;
    }
    form input, form button {
      display: block;
      width: 100%;
      padding: 8px;
      margin: 8px 0;
      background: #020617;
      color: white;
      border: 1px solid #1e293b;
      border-radius: 6px;
    }
    form button {
      background: #38bdf8;
      color: black;
      font-weight: bold;
      cursor: pointer;
    }
    footer {
      text-align: center;
      padding: 20px;
      color: #94a3b8;
      font-size: 14px;
    }
  </style>
</head>

<body>

<header>Staff Dispatch Web</header>

<nav>
  <a href="index.html">Home</a>
  <a href="workers.html">Workers</a>
  <a href="customers.html">Customers</a>
  <a href="events.html">Events</a>
</nav>

<div class="section">
  <h2>Add Worker</h2>
  <form id="worker-form">
    <input name="name" placeholder="Name" required />
    <input name="role" placeholder="Role" required />
    <input name="contract" placeholder="Contract type" required />
    <input name="stars" type="number" min="1" max="5" placeholder="Stars" />
    <button>Add Worker</button>
  </form>
</div>

<div class="section">
  <h2>Add Customer</h2>
  <form id="customer-form">
    <input name="name" placeholder="Customer Name" required />
    <input name="customer_type" placeholder="Customer Type" required />
    <input name="custom_rate" type="number" placeholder="Custom Rate (ZAR)" />
    <button>Add Customer</button>
  </form>
</div>

<div class="section">
  <h2>Add Event</h2>
  <form id="event-form">
    <input name="title" placeholder="Event Title" required />
    <input name="date" type="date" required />
    <input name="location" placeholder="Location" required />
    <input name="staff_needed" type="number" placeholder="Staff Needed" required />
    <input name="status" placeholder="Status" required />
    <button>Add Event</button>
  </form>
</div>

<footer>© 2025 Staff Dispatch Web — Built by Mel 🚀</footer>

<!-- ✅ SINGLE Supabase connection -->
<script type="module" src="supabaseClient.js"></script>

<script type="module">
  const workerForm = document.getElementById('worker-form')
  const customerForm = document.getElementById('customer-form')
  const eventForm = document.getElementById('event-form')

  workerForm.onsubmit = async e => {
    e.preventDefault()
    const data = Object.fromEntries(new FormData(workerForm))
    await window.supabase.from('workers').insert([data])
    workerForm.reset()
  }

  customerForm.onsubmit = async e => {
    e.preventDefault()
    const data = Object.fromEntries(new FormData(customerForm))
    await window.supabase.from('customers').insert([data])
    customerForm.reset()
  }

  eventForm.onsubmit = async e => {
    e.preventDefault()
    const data = Object.fromEntries(new FormData(eventForm))
    await window.supabase.from('events').insert([data])
    eventForm.reset()
  }
</script>

</body>
</html>
